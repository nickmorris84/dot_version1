# path to CSV (or you can pass a DataFrame/dict at runtime instead)
customer_id: customer_a

data_config:
  source: data/events.csv
  # choose implementations + params

  gate:
    extract_envelope: true
    normalize_payload: true
    idempotency_check: true
    schema_validation:
      mode: report
      attach_metric: true

  normaliser:
    trim_strings: true
    normalize_case: { columns: "*", case: lower }

  standardiser:
    to_snake_case: true
    rename: { mapping: { 
      "activity_id": "event_id",
      "Application_id": "journey_id",
      "stage": "step",
      "product_type": "product",
      "stage_start_time": "start_ts",
      "stage_end_time": "end_ts",
      "activity_type": "event_type",
      "activity_notes": "event_description",
      "risk_grade": "event_codes"} }

  # per-record classifiers
  # classifiers:
  #   - name: risk_classifier
  #     params:
  #       levels: [high, critical]
  #   - name: status_label

  data_quality:
    check_required_columns: { columns: ["event_id", "customer_id"] }

  schema_enforce:
    schema_validation:
      mode: enforce
      supported_versions: ["v1"]
